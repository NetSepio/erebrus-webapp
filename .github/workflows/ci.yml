name: ci

on:
  push:
    branches: [main, prod]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - name: Prepare build env
        env:
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
          NEXT_PUBLIC_HELIUS_API_KEY: ${{ secrets.NEXT_PUBLIC_HELIUS_API_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_PROJECT_ID" ]; then
            PROJECT_ID="$NEXT_PUBLIC_PROJECT_ID"
          else
            PROJECT_ID="00000000000000000000000000000000"
          fi
          HELIUS="${NEXT_PUBLIC_HELIUS_API_KEY:-ci-build-placeholder}"
          cat > .env.local <<EOF
          NEXT_PUBLIC_PROJECT_ID=$PROJECT_ID
          NEXT_PUBLIC_GATEWAY_URL=https://gateway.erebrus.io/
          NEXT_PUBLIC_HELIUS_API_KEY=$HELIUS
          EOF
      - run: pnpm build