name: deploy

# Called from ci.yml after the build job passes on a push to main or prod.
# Runs as a reusable workflow so the deploy.yml from the pushed commit is used
# (a workflow_run trigger always uses the default branch's copy).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image (development)
        if: github.ref_name == 'main'
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          echo "$DEV_ENV_FILE" > .env.local
          export TAG=main
          export GITHUB_REF_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}
          export GITHUB_BRANCH_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG
          docker build --build-arg version=${{ github.sha }} \
            -t "$GITHUB_REF_IMAGE" -t "$GITHUB_BRANCH_IMAGE" .
          docker push "$GITHUB_REF_IMAGE"
          docker push "$GITHUB_BRANCH_IMAGE"
          rm -f .env.local

      - name: Build and push image (production)
        if: github.ref_name == 'prod'
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          echo "$PROD_ENV_FILE" > .env
          export TAG=prod
          export GITHUB_REF_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}
          export GITHUB_BRANCH_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG
          docker build --build-arg version=${{ github.sha }} \
            -t "$GITHUB_REF_IMAGE" -t "$GITHUB_BRANCH_IMAGE" .
          docker push "$GITHUB_REF_IMAGE"
          docker push "$GITHUB_BRANCH_IMAGE"
          rm -f .env

      - name: Copy compose manifest to development server
        if: github.ref_name == 'main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_REMOTE_SERVER_KEY }}
          SSH_HOST: ${{ secrets.DEV_REMOTE_SERVER_ADDRESS }}
          SSH_USER: ${{ secrets.DEV_SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}")
          # scp uses -P (uppercase) for port; ssh uses -p (lowercase).
          SCP_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}")
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "mkdir -p ~/erebrus-webapp-dev"
          scp "${SCP_OPTS[@]}" deploy/docker-compose.yml "${SSH_TARGET}:~/erebrus-webapp-dev/"
          rm -f ~/.ssh/deploy_key

      - name: Deploy to development server
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_REMOTE_SERVER_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            set -euo pipefail
            export WEBAPP_IMAGE=ghcr.io/netsepio/erebrus-webapp:main
            export WEBAPP_CONTAINER_NAME=erebrus-frontend-dev
            export WEBAPP_ROUTER=erebrus-webapp-dev
            export WEBAPP_HOST=dev.erebrus.io
            export WEBAPP_HOST_PORT=4041

            cd ~/erebrus-webapp-dev
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # One-time migration: remove the old container started by plain `docker run`,
            # otherwise compose fails on the container_name conflict.
            if docker inspect "$WEBAPP_CONTAINER_NAME" >/dev/null 2>&1 && \
               [[ -z "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$WEBAPP_CONTAINER_NAME")" ]]; then
              docker rm -f "$WEBAPP_CONTAINER_NAME"
            fi

            docker compose -p erebrus-webapp-dev pull
            docker compose -p erebrus-webapp-dev up -d --remove-orphans

            for i in $(seq 1 30); do
              curl -fsS -o /dev/null --max-time 2 "http://127.0.0.1:${WEBAPP_HOST_PORT}/" && break
              sleep 1
            done

            docker image prune -f

      - name: Copy compose manifest to production server
        if: github.ref_name == 'prod'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_REMOTE_SERVER_KEY }}
          SSH_HOST: ${{ secrets.PROD_REMOTE_SERVER_ADDRESS }}
          SSH_USER: ${{ secrets.PROD_SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}")
          # scp uses -P (uppercase) for port; ssh uses -p (lowercase).
          SCP_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}")
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "mkdir -p ~/erebrus-webapp"
          scp "${SCP_OPTS[@]}" deploy/docker-compose.yml "${SSH_TARGET}:~/erebrus-webapp/"
          rm -f ~/.ssh/deploy_key

      - name: Deploy to production server
        if: github.ref_name == 'prod'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_REMOTE_SERVER_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -euo pipefail
            export WEBAPP_IMAGE=ghcr.io/netsepio/erebrus-webapp:prod
            export WEBAPP_CONTAINER_NAME=erebrus-frontend
            export WEBAPP_ROUTER=erebrus-webapp
            export WEBAPP_HOST=erebrus.io
            export WEBAPP_HOST_PORT=4040

            cd ~/erebrus-webapp
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # One-time migration: remove the old container started by plain `docker run`,
            # otherwise compose fails on the container_name conflict.
            if docker inspect "$WEBAPP_CONTAINER_NAME" >/dev/null 2>&1 && \
               [[ -z "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$WEBAPP_CONTAINER_NAME")" ]]; then
              docker rm -f "$WEBAPP_CONTAINER_NAME"
            fi

            docker compose -p erebrus-webapp pull
            docker compose -p erebrus-webapp up -d --remove-orphans

            for i in $(seq 1 30); do
              curl -fsS -o /dev/null --max-time 2 "http://127.0.0.1:${WEBAPP_HOST_PORT}/" && break
              sleep 1
            done

            docker image prune -f
